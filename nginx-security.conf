# вставь внутрь блока server { ... }
server_tokens off;
autoindex off;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
add_header Content-Security-Policy "default-src 'none'; script-src 'sha256-UKyi3nDQVIibSaG677Bg4A7ZmOIKRxiBj+FPAvD8SDc=' 'sha256-BGSc3uDsvlAnm75+lOJ2Jw46VaSVhR/ovqg82kHU/EI='; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data:; connect-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; manifest-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
location ~ /\.(?!well-known) { deny all; }
limit_req_zone $binary_remote_addr zone=gt:10m rate=10r/s; # вне server
# внутри location /  ->  limit_req zone=gt burst=30 nodelay;
